name: Check trailers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia una notifica di prova su Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-trailers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Telegram test notification
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SILENT: ${{ vars.TELEGRAM_SILENT }}
        run: python scripts/notify_telegram.py --test

      - name: Run trailer check
        id: check
        run: python scripts/check_trailers.py

      # Se nel frattempo qualcuno ha pushato sul branch (merge di una PR, modifica
      # manuale), il push viene rifiutato: ci si riallinea al remoto, si rigenerano
      # i dati a partire da quello stato e si riprova.
      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_se_cambiato() {
            if git diff --quiet -- data.json seen_ids.json; then
              return 1
            fi
            git add data.json seen_ids.json
            git commit -m "Aggiorna trailer $(date -u +'%Y-%m-%d %H:%M UTC')"
            return 0
          }

          if ! commit_se_cambiato; then
            echo "Nessuna modifica, niente da committare."
            exit 0
          fi

          for tentativo in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              echo "Push riuscito al tentativo $tentativo."
              exit 0
            fi
            echo "Push rifiutato: $BRANCH è cambiato sul remoto. Riallineo e rigenero i dati."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python scripts/check_trailers.py
            if ! commit_se_cambiato; then
              echo "Dopo il riallineamento non restano modifiche: i dati erano già aggiornati."
              exit 0
            fi
          done

          echo "::error::Push fallito dopo 3 tentativi."
          exit 1

      # Il commit avviene prima della notifica: se Telegram è mal configurato
      # i dati del sito vengono comunque aggiornati.
      - name: Notify Telegram
        if: steps.check.outputs.new_count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SILENT: ${{ vars.TELEGRAM_SILENT }}
        run: python scripts/notify_telegram.py
