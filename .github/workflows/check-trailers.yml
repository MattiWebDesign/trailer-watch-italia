name: Check trailers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Invia una notifica di prova su Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-trailers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Telegram test notification
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SILENT: ${{ vars.TELEGRAM_SILENT }}
        run: python scripts/notify_telegram.py --test

      - name: Run trailer check
        id: check
        run: python scripts/check_trailers.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json seen_ids.json; then
            echo "Nessuna modifica, niente da committare."
          else
            git add data.json seen_ids.json
            git commit -m "Aggiorna trailer $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Il commit avviene prima della notifica: se Telegram è mal configurato
      # i dati del sito vengono comunque aggiornati.
      - name: Notify Telegram
        if: steps.check.outputs.new_count != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SILENT: ${{ vars.TELEGRAM_SILENT }}
        run: python scripts/notify_telegram.py
